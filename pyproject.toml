[project]
name = "meshtron"
version = "0.1.0"
description = "Meshtron domain-partition: HO-quad block-structure transformer for CFD meshing"
requires-python = ">=3.12"
dependencies = [
    "torch==2.11.0",
    "torchvision==0.26.0",
    "torchaudio==2.11.0",
    "numpy>=2.4",
    "matplotlib>=3.11",
    "tqdm>=4.68",
    "torch-geometric>=2.8",
    "networkx>=3.6",
    "pandas>=2.0",
    "seaborn>=0.13",
    "optuna>=4.0",
    "gmsh>=4.15",
    "textual>=8.2.8",
    "plotly>=7.1.0",
]

# openmesh braucht Kompilierung (C++), nur von den half_edge-Modulen genutzt, NICHT
# vom Trainings-Pfad (run_domain_10k / chain_e2e / *_head). Optional halten, damit
# `uv sync` nicht an einem Build scheitert. Bei Bedarf: `uv sync --extra mesh`.
[project.optional-dependencies]
mesh = ["openmesh>=1.2"]

# torch/vision/audio als +cuXXX-Builds vom PyTorch-Index (Blackwell = cu128).
# Fuer andere CUDA-Version: URL unten anpassen (z.B. cu126) und uv.lock neu bauen.
[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

# Reiner App-Ordner (kein installierbares Paket) -> uv soll das Projekt nicht bauen.
[tool.uv]
package = false
